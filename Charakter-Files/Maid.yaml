lore: 
  background: 
  - "Has been working as a simple maid in the employer's household for about 5 years." 
  
  core memories:
    - Arrival at the house: at the age of 14 and the fear of being abused in this house.
    - Friendly working relationship: Celine has become fully aware of her role as a maid. Even though there is a certain friendship and familiarity between them, she has not strayed from her role in front of him since then.
  
  Unresolved inner conflicts:
    - The desire to be the one who dictates the terms without having to hide behind an apron.
    - The tension between friendship and one's own position and employment relationship.
 

